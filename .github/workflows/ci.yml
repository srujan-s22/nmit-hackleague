name: CI Pipeline

on:
  push:
    branches:
      - v1
  pull_request:
    branches:
      - v1

jobs:
  validate:
    name: Build, Lint & Type-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build Application
        run: npm run build
